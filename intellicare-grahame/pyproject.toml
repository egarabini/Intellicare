[tool.poetry]
name = "intellicare-grahame"
version = "1.1.0"
description = "IntelliCare Grahame — Agente de Interoperabilidade FHIR R4"
authors = ["IntelliCare Team"]
readme = "README.md"
packages = [{include = "grahame"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.115.0,<0.116.0"
starlette = ">=0.40.0,<0.41.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
asyncpg = "^0.29.0"
psycopg = {extras = ["binary"], version = "^3.1.0"}
pydantic = "^2.0"
pydantic-settings = "^2.0"
structlog = "^24.0.0"
alembic = "^1.13.0"
fhir-resources = "^7.0"
redis = "^5.0.0"
httpx = "^0.27.0"
intellicare-core = {path = "../intellicare-core", develop = true}
lxml = "^5.1.0"
xmlschema = "^3.0.0"
chardet = "^5.2.0"


[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
httpx = "^0.27.0"
pytest-cov = "^4.0.0"
aiosqlite = "^0.20.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
