[tool.poetry]
name = "intellicare-gestor"
version = "1.0.0"
description = "IntelliCare Gestor — Gestão de usuários, RBAC e setores por tenant"
authors = ["IntelliCare Team"]
readme = "README.md"
packages = [{include = "gestor"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
asyncpg = "^0.29.0"
psycopg = {extras = ["binary"], version = "^3.1.0"}
pydantic = "^2.0"
pydantic-settings = "^2.0"
email-validator = "^2.0.0"
structlog = "^24.0.0"
alembic = "^1.13.0"
redis = "^5.0.0"
intellicare-core = {path = "../intellicare-core", develop = true}


[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
httpx = "^0.27.0"
pytest-cov = "^4.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
