# =============================================================================
# Docker Compose - Keycloak para IntelliCare Multi-Tenant
# =============================================================================
# Propósito: Servidor de autenticação SSO centralizado
# Use: docker-compose -f docker-compose.keycloak.yml up -d
# =============================================================================

services:
  # --------------------------------------------------------------------------
  # PostgreSQL dedicado para Keycloak
  # --------------------------------------------------------------------------
  keycloak-db:
    image: postgres:15-alpine
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-changeme}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    networks:
      - intellicare_intellicare-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    # Para produção: usar limites de recursos
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1.0'
    #       memory: 1G
    #     reservations:
    #       memory: 512M

  # --------------------------------------------------------------------------
  # Keycloak Server
  # --------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak-intellicare
    # Em desenvolvimento: start-dev --import-realm
    # Em produção: start --import-realm
    command: start-dev --import-realm
    environment:
      # Database Configuration
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-changeme}
      KC_DB_SCHEMA: public

      # Hostname (não definir para HTTP development)
      # KC_HOSTNAME será determinado automaticamente
      KC_HTTP_ENABLED: "true"

      # Admin User (Criado automaticamente na primeira execução)
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-changeme}

      # Realm Default
      KC_REALM: bemcuidar

      # Logging
      KC_LOG_LEVEL: INFO
      KC_LOG_CONSOLE_OUTPUT: json
      KC_LOG_FORMAT: json

      # Proxy / HTTPS (none para HTTP em staging, edge para HTTPS com proxy)
      KC_PROXY: none
      KC_HOSTNAME_STRICT: "false"

      # CORS (desenvolvimento)
      KC_HTTP_CORS: "true"
      KC_HTTP_CORS_MAX_AGE: "86400"
      KC_HTTP_CORS_ALLOWED_METHODS: "GET,POST,PUT,DELETE,OPTIONS,PATCH"
      KC_HTTP_CORS_ALLOWED_HEADERS: "Authorization,Content-Type,Accept,X-Tenant-ID,Origin"
      KC_HTTP_CORS_EXPOSED_HEADERS: "Authorization"

      # Performance
      KC_DB_POOL_MIN_SIZE: "5"
      KC_DB_POOL_MAX_SIZE: "20"
      KC_DB_POOL_INITIAL_SIZE: "5"

      # Cache
      KC_HOSTNAME_STRICT_HTTPS: "false"

      # Health
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"

    volumes:
      # Import realm automaticamente
      - ./keycloak/import:/opt/keycloak/data/import:ro
      # Custom themes (opcional)
      # - ./keycloak/themes:/opt/keycloak/themes:ro
      # Keystore (HTTPS)
      - ./keycloak/certs:/opt/keycloak/conf:ro

    ports:
      - "${KEYCLOAK_HTTP_PORT:-8080}:8080"  # HTTP
      - "${KEYCLOAK_HTTPS_PORT:-8443}:8443"  # HTTPS

    networks:
      - intellicare_intellicare-network

    depends_on:
      keycloak-db:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    restart: unless-stopped

    # Labels para Traefik (produção)
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=Host(`auth.intellicare.ia.br`)"
      - "traefik.http.routers.keycloak.entrypoints=websecure"
      - "traefik.http.routers.keycloak.tls.certresolver=letsencrypt"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"

networks:
  intellicare_intellicare-network:
    external: true

volumes:
  keycloak_db_data:
    driver: local
