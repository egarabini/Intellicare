# =============================================================================
# Docker Compose - Keycloak para IntelliCare Multi-Tenant
# =============================================================================
# Propósito: Servidor de autenticação SSO centralizado
# Use: docker-compose -f docker-compose.keycloak.yml up -d
# =============================================================================

services:
  # --------------------------------------------------------------------------
  # PostgreSQL dedicado para Keycloak
  # --------------------------------------------------------------------------
  keycloak-db:
    image: postgres:15-alpine
    container_name: keycloak-db
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak_db}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak_admin}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-changeme}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    networks:
      - intellicare_intellicare-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER:-keycloak_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    # Para produção: usar limites de recursos
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1.0'
    #       memory: 1G
    #     reservations:
    #       memory: 512M

  # --------------------------------------------------------------------------
  # Keycloak Server
  # --------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak-intellicare
    # --import-realm: importa realm apenas se não existir (Keycloak ignora se já existe)
    # Na primeira execução: cria o realm. Nas demais: segue silenciosamente.
    command: start-dev --import-realm
    environment:
      # Database Configuration
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME:-keycloak_db}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak_admin}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-changeme}
      KC_DB_SCHEMA: public

      # Hostname explícito — corrige NullPointerException no authority() do Vert.x
      # quando Keycloak recebe requests sem Host header válido (ex: healthcheck interno)
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME_URL:-http://localhost:8080}
      KC_HTTP_ENABLED: "true"

      # Admin User (Criado automaticamente na primeira execução)
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-changeme}


      # Realm Default
      KC_REALM: bemcuidar

      # Logging
      KC_LOG_LEVEL: INFO
      KC_LOG_CONSOLE_OUTPUT: json
      KC_LOG_FORMAT: json

      # Proxy / HTTPS
      KC_PROXY: none
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"

      # CORS (desenvolvimento)
      KC_HTTP_CORS: "true"
      KC_HTTP_CORS_MAX_AGE: "86400"
      KC_HTTP_CORS_ALLOWED_METHODS: "GET,POST,PUT,DELETE,OPTIONS,PATCH"
      KC_HTTP_CORS_ALLOWED_HEADERS: "Authorization,Content-Type,Accept,X-Tenant-ID,Origin"
      KC_HTTP_CORS_EXPOSED_HEADERS: "Authorization"

      # Performance
      KC_DB_POOL_MIN_SIZE: "5"
      KC_DB_POOL_MAX_SIZE: "20"
      KC_DB_POOL_INITIAL_SIZE: "5"

      # Health
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"

    volumes:
      # Import realm automaticamente
      - ./intellicare-auth/keycloak/import:/opt/keycloak/data/import:ro
      # Custom themes (opcional)
      # - ./intellicare-auth/keycloak/themes:/opt/keycloak/themes:ro
      # Keystore (HTTPS)
      - ./intellicare-auth/keycloak/certs:/opt/keycloak/conf:ro

    ports:
      - "${KEYCLOAK_HTTP_PORT:-8080}:8080"  # HTTP
      - "${KEYCLOAK_HTTPS_PORT:-8443}:8443"  # HTTPS

    networks:
      - intellicare_intellicare-network

    depends_on:
      keycloak-db:
        condition: service_healthy

    healthcheck:
      # Usa bash /dev/tcp — sem curl (imagem UBI minimal não tem curl)
      # Conecta na porta 8080 e verifica se a resposta contém "UP"
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && cat <&3 | grep -q 'UP' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

    restart: unless-stopped

    # Labels para Traefik (produção)
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=Host(`167.86.97.142`) || Host(`auth.intellicare.ia.br`)"
      - "traefik.http.routers.keycloak.entrypoints=web,websecure"
      - "traefik.http.routers.keycloak.service=keycloak"
      - "traefik.http.routers.keycloak.tls.certresolver=letsencrypt"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"

networks:
  intellicare_intellicare-network:
    external: true

volumes:
  keycloak_db_data:
    driver: local
