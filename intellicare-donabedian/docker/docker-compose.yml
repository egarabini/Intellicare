services:
  db:
    image: postgres:15
    container_name: donabedian-db
    environment:
      POSTGRES_DB: donabedian
      POSTGRES_USER: donabedian
      POSTGRES_PASSWORD: donabedian_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U donabedian"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - donabedian-network

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: donabedian-api
    ports:
      - "8003:8000"
    environment:
      INTELLICARE_DATABASE_URL: postgresql+asyncpg://donabedian:donabedian_dev@db:5432/donabedian
      DATABASE_SCHEMA: intellicare_donabedian
      API_HOST: 0.0.0.0
      API_PORT: 8000
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn donabedian.api.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ../src:/app/src
    networks:
      - donabedian-network

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    container_name: donabedian-dashboard
    ports:
      - "8503:8501"
    environment:
      API_URL: http://api:8000
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_PORT: 8501
    depends_on:
      - api
    command: streamlit run src/donabedian/dashboard/app.py --server.port=8501 --server.address=0.0.0.0
    volumes:
      - ../src:/app/src
    networks:
      - donabedian-network

volumes:
  postgres_data:

networks:
  donabedian-network:
    driver: bridge

