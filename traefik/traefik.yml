# ============================================================================
# Traefik Static Configuration — IntelliCare Platform
# ============================================================================
# File: traefik/traefik.yml
# Docs: https://doc.traefik.io/traefik/

# ── Entrypoints ─────────────────────────────────────────────
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt

# ── Certificate Resolvers ───────────────────────────────────
certificatesResolvers:
  letsencrypt:
    acme:
      email: admin@intellicare.ia.br
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web
  letsencrypt-wildcard:
    acme:
      email: admin@intellicare.ia.br
      storage: /letsencrypt/acme-wildcard.json
      dnsChallenge:
        provider: route53
        resolvers:
          - "8.8.8.8:53"
          - "1.1.1.1:53"

# ── Providers ───────────────────────────────────────────────
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: intellicare_intellicare-network
  file:
    directory: /etc/traefik/dynamic/
    watch: true

# ── API / Dashboard ─────────────────────────────────────────
api:
  dashboard: true
  insecure: false

# ── Logging ─────────────────────────────────────────────────
log:
  level: INFO
  format: json

accessLog:
  format: json
  filters:
    statusCodes:
      - "400-599"
    retryAttempts: true

# ── Metrics (Prometheus) ────────────────────────────────────
metrics:
  prometheus:
    entryPoint: websecure
    addEntryPointsLabels: true
    addServicesLabels: true
    addRoutersLabels: true
