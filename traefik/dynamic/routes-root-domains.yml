# ============================================================================
# Traefik Dynamic Configuration — Root Domain Redirects
# ============================================================================
# File: traefik/dynamic/routes-root-domains.yml
#
# Redireciona domínios raiz para subdomínios apropriados:
#   intellicare.ia.br       → portal.intellicare.ia.br
#   www.intellicare.ia.br   → portal.intellicare.ia.br
#   saudeplanner.com.br     → portal.intellicare.ia.br
#   www.saudeplanner.com.br → portal.intellicare.ia.br

http:
  routers:

    # ── intellicare.ia.br (root) → portal.intellicare.ia.br ──────
    root-intellicare:
      rule: "Host(`intellicare.ia.br`)"
      entryPoints:
        - websecure
      service: noop@internal
      tls:
        certResolver: letsencrypt
      middlewares:
        - redirect-to-portal-intellicare
      priority: 1  # Baixa prioridade (outras rotas têm precedência)

    # ── www.intellicare.ia.br → portal.intellicare.ia.br ─────────
    www-intellicare:
      rule: "Host(`www.intellicare.ia.br`)"
      entryPoints:
        - websecure
      service: noop@internal
      tls:
        certResolver: letsencrypt
      middlewares:
        - redirect-to-portal-intellicare
      priority: 1

    # ── saudeplanner.com.br (root) → portal.intellicare.ia.br ──
    root-saudeplanner:
      rule: "Host(`saudeplanner.com.br`)"
      entryPoints:
        - websecure
      service: noop@internal
      tls:
        certResolver: letsencrypt
      middlewares:
        - redirect-to-portal-intellicare
      priority: 1

    # ── www.saudeplanner.com.br → portal.intellicare.ia.br ─────
    www-saudeplanner:
      rule: "Host(`www.saudeplanner.com.br`)"
      entryPoints:
        - websecure
      service: noop@internal
      tls:
        certResolver: letsencrypt
      middlewares:
        - redirect-to-portal-intellicare
      priority: 1

  # ── Middlewares ─────────────────────────────────────────────────
  middlewares:

    # Redirecionar para portal.intellicare.ia.br (301 Permanent)
    redirect-to-portal-intellicare:
      redirectRegex:
        regex: "^https?://(?:www\\.)?(intellicare\\.ia\\.br|saudeplanner\\.com\\.br)/(.*)"
        replacement: "https://portal.intellicare.ia.br/${2}"
        permanent: true

# ============================================================================
# Alternativa: Servir Landing Page
# ============================================================================
# Se preferir servir uma landing page ao invés de redirecionar,
# descomente as seções abaixo e crie o serviço intellicare-landing.
