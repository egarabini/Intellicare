#         healthCheck:
#           path: /
#           interval: 30s
#           timeout: 5s
# ============================================================================

# ============================================================================
# Notas de Implementação
# ============================================================================
#
# 1. DNS Configuration Required:
#    Adicione os seguintes registros DNS:
#
#    A    intellicare.ia.br           167.86.97.142
#    A    www.intellicare.ia.br       167.86.97.142
#    A    saudeplanner.com.br         167.86.97.142
#    A    www.saudeplanner.com.br     167.86.97.142
#
# 2. Certificate Generation:
#    Traefik irá gerar certificados Let's Encrypt automaticamente
#    para os domínios raiz quando receberem a primeira requisição.
#
# 3. Testing:
#    curl -I https://intellicare.ia.br
#    # Deve retornar: HTTP/2 301 (redirect para portal.intellicare.ia.br)
#
#    curl -I https://www.intellicare.ia.br
#    # Deve retornar: HTTP/2 301 (redirect para portal.intellicare.ia.br)
#
#    curl -I https://saudeplanner.com.br
#    # Deve retornar: HTTP/2 301 (redirect para portal.intellicare.ia.br)
#
# 4. Priority:
#    priority: 1 garante que rotas mais específicas (subdomínios)
#    tenham precedência sobre estas rotas de fallback.
#
# ============================================================================

