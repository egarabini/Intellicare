# ============================================================================
# Traefik Dynamic Configuration — Middleware Chains
# ============================================================================
# File: traefik/dynamic/middlewares.yml

http:

  # ── Middlewares ─────────────────────────────────────────────

  middlewares:

    # ── Security Headers ──────────────────────────────────────
    security-headers:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        frameDeny: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000
        customFrameOptionsValue: "SAMEORIGIN"
        customResponseHeaders:
          X-Powered-By: "IntelliCare"
          X-Content-Type-Options: "nosniff"
          Referrer-Policy: "strict-origin-when-cross-origin"

    # ── CORS — API Endpoints ──────────────────────────────────
    cors-api:
      headers:
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        accessControlAllowHeaders:
          - Content-Type
          - Authorization
          - X-Tenant-ID
          - X-Request-ID
        accessControlAllowOriginList:
          - "https://portal.intellicare.ia.br"
          - "https://admin.intellicare.ia.br"
          - "https://*.saudeplanner.com.br"
          - "http://localhost:3001"
          - "http://localhost:5173"
        accessControlMaxAge: 3600
        accessControlAllowCredentials: true
        addVaryHeader: true

    # ── Rate Limiting — API ───────────────────────────────────
    rate-limit-api:
      rateLimit:
        average: 100
        burst: 200
        period: 1m

    # ── Rate Limiting — Auth (stricter) ───────────────────────
    rate-limit-auth:
      rateLimit:
        average: 20
        burst: 50
        period: 1m

    # ── Compress ──────────────────────────────────────────────
    compress:
      compress:
        excludedContentTypes:
          - "text/event-stream"

    # ── Strip Prefix (for /api/v1/module routing) ─────────────
    strip-api-prefix:
      stripPrefix:
        prefixes:
          - "/api/v1"

    # ── Retry on backend failure ──────────────────────────────
    retry:
      retry:
        attempts: 3
        initialInterval: 100ms

    # ── Tenant Header Injection (white-label subdomains) ──────
    # Traefik v3 doesn't have regex-based header injection natively,
    # so the backend TenantResolver handles subdomain → tenant_id.
    # This middleware is a placeholder for documentation purposes.
    # The actual resolution happens in intellicare-core TenantResolver
    # by reading the Host header directly.

    # ── Middleware Chain: API (combine all) ────────────────────
    api-chain:
      chain:
        middlewares:
          - security-headers
          - cors-api
          - rate-limit-api
          - compress

    # ── Middleware Chain: Keycloak Auth ──────────────────────
    keycloak-chain:
      chain:
        middlewares:
          - compress

    # ── Middleware Chain: Frontend ─────────────────────────────
    frontend-chain:
      chain:
        middlewares:
          - security-headers
          - compress
