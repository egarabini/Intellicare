[pytest]
# Pytest configuration for intellicare-auth

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum Python version
minversion = 3.11

# Add options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=src/auth
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=80
    -p no:warnings

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests
    api: API tests
    models: Model tests
    schemas: Schema tests
    dashboard: Dashboard tests

# Asyncio mode
asyncio_mode = auto

# Coverage options
[coverage:run]
source = src/auth
omit =
    */tests/*
    */migrations/*
    */__pycache__/*
    */venv/*
    */env/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov


