# Painel Metabolico — Reference Ranges
# Fontes: ADA 2024, SBC, UpToDate

id: metabolic_panel
name: "Painel Metabolico"
description: "Exames de perfil metabolico e lipidico"

labs:
  - id: glucose_fasting
    name: "Glicemia de Jejum"
    loinc_code: "1558-6"
    unit: "mg/dL"
    normal_min: 70.0
    normal_max: 99.0
    low_min: 55.0
    high_max: 126.0
    critical_low: 40.0
    critical_high: 400.0
    panic_low: 30.0
    panic_high: 500.0

  - id: hba1c
    name: "Hemoglobina Glicada"
    loinc_code: "4548-4"
    unit: "%"
    normal_min: 4.0
    normal_max: 5.6
    high_max: 6.4
    critical_high: 10.0
    panic_high: 14.0

  - id: total_cholesterol
    name: "Colesterol Total"
    loinc_code: "2093-3"
    unit: "mg/dL"
    normal_min: 0.0
    normal_max: 190.0
    high_max: 240.0
    critical_high: 300.0

  - id: hdl
    name: "HDL Colesterol"
    loinc_code: "2085-9"
    unit: "mg/dL"
    normal_min: 40.0
    normal_max: 999.0
    low_min: 35.0
    critical_low: 20.0
    gender_specific: true
    notes: "Feminino: referencia >= 50"

  - id: ldl
    name: "LDL Colesterol"
    loinc_code: "13457-7"
    unit: "mg/dL"
    normal_min: 0.0
    normal_max: 130.0
    high_max: 160.0
    critical_high: 190.0

  - id: triglycerides
    name: "Triglicerides"
    loinc_code: "2571-8"
    unit: "mg/dL"
    normal_min: 0.0
    normal_max: 150.0
    high_max: 200.0
    critical_high: 500.0
    panic_high: 1000.0
