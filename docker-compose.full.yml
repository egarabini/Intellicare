version: "3.9"

# ============================================================================
# IntelliCare - Full Stack Deployment
# ============================================================================
# Includes: Infrastructure + 13 Backend Modules + 1 Frontend
# Phase: 4 - Deploy Completo
# ============================================================================

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local

networks:
  intellicare-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

services:
  # ==========================================================================
  # INFRASTRUCTURE - PostgreSQL 15
  # ==========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: intellicare-postgres
    hostname: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-intellicare_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      POSTGRES_DB: ${POSTGRES_DB:-intellicare_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-intellicare_admin} -d ${POSTGRES_DB:-intellicare_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - intellicare-network
    restart: unless-stopped
    labels:
      com.intellicare.service: "postgres"
      com.intellicare.tier: "infrastructure"

  # ==========================================================================
  # INFRASTRUCTURE - Redis 7
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: intellicare-redis
    hostname: redis
    command: 
      - redis-server
      - "--appendonly"
      - "yes"
      - "--maxmemory"
      - "512mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - intellicare-network
    restart: unless-stopped
    labels:
      com.intellicare.service: "redis"
      com.intellicare.tier: "infrastructure"

  # ==========================================================================
  # INFRASTRUCTURE - Prometheus
  # ==========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: intellicare-prometheus
    hostname: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    networks:
      - intellicare-network
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    labels:
      com.intellicare.service: "prometheus"
      com.intellicare.tier: "infrastructure"

  # ==========================================================================
  # INFRASTRUCTURE - Grafana
  # ==========================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: intellicare-grafana
    hostname: grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-CHANGE_ME}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - intellicare-network
    depends_on:
      - prometheus
    restart: unless-stopped
    labels:
      com.intellicare.service: "grafana"
      com.intellicare.tier: "infrastructure"

  # ==========================================================================
  # BACKEND - Florence (8001) - RAG + Protocolos Clínicos
  # ==========================================================================
  florence:
    build:
      context: .
      dockerfile: ./intellicare-florence/Dockerfile
      target: api
    container_name: intellicare-florence
    hostname: florence
    environment:
      - INTELLICARE_ENVIRONMENT=${ENVIRONMENT:-development}
      - INTELLICARE_LOG_LEVEL=${LOG_LEVEL:-INFO}
      - FLORENCE_PORT=${FLORENCE_PORT:-8001}
      - INTELLICARE_FLORENCE_DATABASE_URL=${INTELLICARE_FLORENCE_DATABASE_URL}
      - FLORENCE_DATABASE_SCHEMA=${FLORENCE_DATABASE_SCHEMA:-intellicare_florence}
      - INTELLICARE_FHIR_SERVER_URL=${INTELLICARE_FHIR_SERVER_URL}
      - INTELLICARE_REDIS_URL=${REDIS_URL}
      - INTELLICARE_ENABLE_RAG=${INTELLICARE_ENABLE_RAG:-true}
      - INTELLICARE_ENABLE_DIAGNOSTIC_SUPPORT=${INTELLICARE_ENABLE_DIAGNOSTIC_SUPPORT:-true}
    ports:
      - "${FLORENCE_PORT:-8001}:8000"
    networks:
      - intellicare-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      com.intellicare.service: "florence"
      com.intellicare.tier: "backend"
      com.intellicare.module: "rag-protocolos"

  # ==========================================================================
