      - DONABEDIAN_DATABASE_SCHEMA=${DONABEDIAN_DATABASE_SCHEMA:-intellicare_donabedian}
      - INTELLICARE_FHIR_SERVER_URL=${INTELLICARE_FHIR_SERVER_URL}
      - INTELLICARE_REDIS_URL=${REDIS_URL}
      - API_HOST=0.0.0.0
      - API_PORT=8003
    ports:
      - "${DONABEDIAN_PORT:-8003}:8000"
    networks:
      - intellicare-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
