      context: .
      dockerfile: ./intellicare-nise/Dockerfile
    container_name: intellicare-nise
    hostname: nise
    environment:
      - INTELLICARE_ENVIRONMENT=${ENVIRONMENT:-development}
      - INTELLICARE_LOG_LEVEL=${LOG_LEVEL:-INFO}
      - NISE_PORT=${NISE_PORT:-8013}
      - INTELLICARE_NISE_DATABASE_URL=${INTELLICARE_NISE_DATABASE_URL}
      - NISE_DATABASE_SCHEMA=${NISE_DATABASE_SCHEMA:-intellicare_nise}
      - INTELLICARE_FHIR_SERVER_URL=${INTELLICARE_FHIR_SERVER_URL}
      - INTELLICARE_REDIS_URL=${REDIS_URL}
    ports:
      - "${NISE_PORT:-8013}:8000"
    networks:
      - intellicare-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      com.intellicare.service: "nise"
      com.intellicare.tier: "backend"
      com.intellicare.module: "chatbot-training"

  # ==========================================================================
  # FRONTEND - Portal (3001) - Interface Web
  # ==========================================================================
  portal:
    build:
      context: ./intellicare-portal/frontend
      dockerfile: Dockerfile
      target: production
    container_name: intellicare-portal
    hostname: portal
    environment:
      - VITE_API_FLORENCE_URL=${VITE_API_FLORENCE_URL:-http://localhost:8001}
      - VITE_API_OSWALDO_URL=${VITE_API_OSWALDO_URL:-http://localhost:8002}
      - VITE_API_DONABEDIAN_URL=${VITE_API_DONABEDIAN_URL:-http://localhost:8003}
      - VITE_API_WANDA_URL=${VITE_API_WANDA_URL:-http://localhost:8004}
      - VITE_API_COMUNICACAO_URL=${VITE_API_COMUNICACAO_URL:-http://localhost:8005}
      - VITE_API_GERALDA_URL=${VITE_API_GERALDA_URL:-http://localhost:8006}
      - VITE_API_TIMEOUT=${VITE_API_TIMEOUT:-30000}
      - VITE_ENABLE_ANALYTICS=${VITE_ENABLE_ANALYTICS:-false}
      - VITE_APP_VERSION=${VITE_APP_VERSION:-0.1.0-demo}
    ports:
      - "${PORTAL_PORT:-3001}:80"
    networks:
      - intellicare-network
    depends_on:
      - florence
      - oswaldo
      - donabedian
      - wanda
      - comunicacao
      - geralda
      - zilda
      - minerva
      - pierre
      - admin
      - gestor
      - grahame
      - nise
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      com.intellicare.service: "portal"
      com.intellicare.tier: "frontend"
      com.intellicare.module: "interface-web"

# ============================================================================
# Usage Instructions
# ============================================================================
# 1. Copy .env.example to .env and configure your environment variables
#
# 2. Start all services:
#    docker-compose -f docker-compose.full.yml up -d
#
# 3. Start only base services (6 modules + portal):
#    docker-compose -f docker-compose.full.yml up -d florence oswaldo donabedian wanda comunicacao geralda portal
#
# 4. Start additional modules:
#    docker-compose -f docker-compose.full.yml up -d zilda minerva pierre admin gestor grahame nise
#
# 5. Check service status:
#    docker-compose -f docker-compose.full.yml ps
#
# 6. View logs:
#    docker-compose -f docker-compose.full.yml logs -f [service_name]
#
# 7. Stop all services:
#    docker-compose -f docker-compose.full.yml down
#
# 8. Stop and remove volumes (WARNING: deletes all data):
#    docker-compose -f docker-compose.full.yml down -v
#
# 9. Access services:
#    - Portal:       http://localhost:3001
#    - Florence:     http://localhost:8001 (RAG + Protocolos Clínicos)
#    - Oswaldo:      http://localhost:8002 (Análise Clínica + FHIR)
#    - Donabedian:   http://localhost:8003 (Qualidade + Indicadores)
#    - Wanda:        http://localhost:8004 (Orquestração + Workflows)
#    - Comunicacao:  http://localhost:8005 (Comunicação + Notificações)
#    - Geralda:      http://localhost:8006 (Gestão + Administrativo)
#    - Zilda:        http://localhost:8007 (CNES + DATASUS)
#    - Minerva:      http://localhost:8008 (OCR + Document Extraction)
#    - Pierre:       http://localhost:8009 (Scientific Search)
#    - Admin:        http://localhost:8010 (System Administration)
#    - Gestor:       http://localhost:8011 (Clinical Module Management)
#    - Grahame:      http://localhost:8012 (FHIR R4 + CDS Hooks)
#    - Nise:         http://localhost:8013 (Chatbot + Training)
#    - Prometheus:   http://localhost:9090
#    - Grafana:      http://localhost:3000
# ============================================================================
