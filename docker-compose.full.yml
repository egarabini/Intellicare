      - OSWALDO_PORT=${OSWALDO_PORT:-8002}
      - INTELLICARE_OSWALDO_DATABASE_URL=${INTELLICARE_OSWALDO_DATABASE_URL}
      - OSWALDO_DATABASE_SCHEMA=${OSWALDO_DATABASE_SCHEMA:-intellicare_oswaldo}
      - INTELLICARE_FHIR_SERVER_URL=${INTELLICARE_FHIR_SERVER_URL}
      - INTELLICARE_REDIS_URL=${REDIS_URL}
      - INTELLICARE_ENABLE_MEDICATION_ADVISOR=${INTELLICARE_ENABLE_MEDICATION_ADVISOR:-false}
      - INTELLICARE_ENABLE_CV_RISK_CALCULATOR=${INTELLICARE_ENABLE_CV_RISK_CALCULATOR:-false}
    ports:
