      - INTELLICARE_WANDA_DATABASE_URL=${INTELLICARE_WANDA_DATABASE_URL}
      - WANDA_DATABASE_SCHEMA=${WANDA_DATABASE_SCHEMA:-intellicare_wanda}
      - INTELLICARE_FHIR_SERVER_URL=${INTELLICARE_FHIR_SERVER_URL}
      - INTELLICARE_REDIS_URL=${REDIS_URL}
      - INTELLICARE_OSWALDO_URL=http://oswaldo:8000
      - INTELLICARE_FLORENCE_URL=http://florence:8000
      - INTELLICARE_DONABEDIAN_URL=http://donabedian:8000
      - INTELLICARE_COMUNICACAO_URL=http://comunicacao:8000
      - INTELLICARE_GERALDA_URL=http://geralda:8000
      - INTELLICARE_DISCOVERY_TIMEOUT_SECONDS=${INTELLICARE_DISCOVERY_TIMEOUT_SECONDS:-5}
