[tool.poetry]
name = "intellicare-admin"
version = "1.0.0"
description = "IntelliCare Platform Administration — SaaS tenant management, billing, and monitoring"
authors = ["IntelliCare Team"]
readme = "README.md"
packages = [{include = "admin"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
asyncpg = "^0.29.0"
psycopg = {extras = ["binary"], version = "^3.1.0"}
pydantic = "^2.0"
pydantic-settings = "^2.0"
python-keycloak = "^3.0.0"
alembic = "^1.13.0"
structlog = "^24.0.0"
httpx = "^0.27.0"
intellicare-core = {path = "../intellicare-core", develop = true}
intellicare-auth = {path = "../intellicare-auth", develop = true}

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
pytest-asyncio = "^0.21"
pytest-cov = "^4.0"
ruff = "^0.1.0"
mypy = "^1.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
