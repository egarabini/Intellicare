# ============================================================================
# Whisper STT — stt.saudeplanner.com.br (VPS 40)
# ============================================================================
# Docker bindado em 127.0.0.1:8000; este server block é o único acesso.
# Whitelist de IPs: só os autorizados chegam ao Whisper; o resto leva 403.
#
# Instalação:
#   sudo cp nginx-whisper.conf /etc/nginx/sites-available/whisper
#   sudo ln -sf /etc/nginx/sites-available/whisper /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL (depois do DNS apontando para esta VPS):
#   sudo certbot --nginx -d stt.saudeplanner.com.br
#   (o Certbot preserva as regras allow/deny)

server {
    listen 80;
    server_name stt.saudeplanner.com.br;

    # ── Whitelist de IPs (Camada de Segurança) ──────────────────────────────
    allow 158.220.99.24;   # servidor autorizado a consumir o STT
    allow 127.0.0.1;       # chamadas locais
    # allow X.X.X.X;       # adicione outros consumidores aqui
    deny all;              # todo o resto: 403 silencioso

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upload de áudio
        client_max_body_size 25M;
        proxy_read_timeout 300s;   # transcrição de áudios longos demora
        proxy_connect_timeout 60s;
    }
}
