services:
  whisper-service:
    build: .
    image: whisper-stt:latest
    container_name: whisper-service
    restart: always
    # SEM porta publicada no host — acessível apenas pela rede interna do
    # Docker. O Traefik (com whitelist de IP) é o único caminho de entrada;
    # o bind 127.0.0.1 fica como atalho para testes no próprio host.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - whisper_models:/app/models
    environment:
      - DEFAULT_MODEL=small      # benchmark 27/10: small=6s, medium=22s, turbo=29s (áudio 7s)
      - CPU_THREADS=4            # 12 threads fazem thrashing na EPYC compartilhada (53s!)
      - BEAM_SIZE=1
      - NUM_WORKERS=1
      - VAD_FILTER=0             # VAD custa ~7s nesta CPU; ligue p/ áudios com silêncio
      - MAX_UPLOAD_BYTES=26214400
      # Token Bearer: definido no .env local do servidor (mesmo diretório, fora
      # do git). Vazio = autenticação só por whitelist de IP.
      - STT_BEARER_TOKEN=${STT_BEARER_TOKEN:-}
    networks:
      - intellicare-network
    deploy:
      resources:
        limits:
          memory: 12G

volumes:
  whisper_models:

networks:
  intellicare-network:
    external: true
    name: intellicare_intellicare-network
