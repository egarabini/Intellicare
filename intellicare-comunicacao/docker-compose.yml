# ============================================================================
# INTELLICARE COMUNICAÇÃO - ROCKET.CHAT + JITSI + FLOWISE + KESTRA
# ============================================================================
# Projeto 05: Sistema de Comunicação e Workflow Integrado
# Responsável: DEV1
# Data: 26/03/2026
# ============================================================================

volumes:
  mongodb_data:
    driver: local
  rocketchat_uploads:
    driver: local
  flowise_data:
    driver: local
  ollama_data:
    driver: local
  jitsi_web_config:
    driver: local
  jitsi_transcripts:
    driver: local
  jitsi_prosody_config:
    driver: local
  jitsi_prosody_plugins:
    driver: local
  jitsi_jicofo_config:
    driver: local
  jitsi_jvb_config:
    driver: local

networks:
  comunicacao-network:
    driver: bridge
    name: comunicacao-network

services:
  # ==========================================================================
  # MONGODB - Database para Rocket.Chat
  # ==========================================================================
  mongodb:
    image: mongo:6.0
    container_name: comunicacao-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
      - mongodb_data:/data/configdb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-rocketchat_mongo_2026}
    command: mongod --oplogSize 128 --replSet rs0
    networks:
      - comunicacao-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # MongoDB Replica Set Initialization
  mongodb-init-replica:
    image: mongo:6.0
    container_name: comunicacao-mongodb-init
    command: >
      bash -c "
        sleep 10 &&
        mongosh --host mongodb:27017 -u admin -p ${MONGO_PASSWORD:-rocketchat_mongo_2026} --authenticationDatabase admin --eval \"
          rs.initiate({
            _id: 'rs0',
            members: [ { _id: 0, host: 'mongodb:27017' } ]
          })
        \"
      "
    depends_on:
      - mongodb
    networks:
      - comunicacao-network

  # ==========================================================================
  # ROCKET.CHAT - Plataforma de Comunicação
  # ==========================================================================
  rocketchat:
    image: rocket.chat:6.5
    container_name: comunicacao-rocketchat
    restart: unless-stopped
    volumes:
      - rocketchat_uploads:/app/uploads
    environment:
      # MongoDB
      - MONGO_URL=mongodb://admin:${MONGO_PASSWORD:-rocketchat_mongo_2026}@mongodb:27017/rocketchat?authSource=admin&replicaSet=rs0
      - MONGO_OPLOG_URL=mongodb://admin:${MONGO_PASSWORD:-rocketchat_mongo_2026}@mongodb:27017/local?authSource=admin&replicaSet=rs0
      
      # Rocket.Chat Configuration
      - ROOT_URL=${ROCKETCHAT_URL:-http://localhost:3000}
      - PORT=3000
      - ADMIN_USERNAME=${ROCKETCHAT_ADMIN_USER:-admin}
      - ADMIN_PASS=${ROCKETCHAT_ADMIN_PASSWORD:-admin123}
      - ADMIN_EMAIL=${ROCKETCHAT_ADMIN_EMAIL:-admin@intellicare.local}
      
      # Setup Wizard
      - OVERWRITE_SETTING_Show_Setup_Wizard=completed
      
      # Jitsi Integration
      - OVERWRITE_SETTING_Jitsi_Enabled=true
      - OVERWRITE_SETTING_Jitsi_Domain=${JITSI_DOMAIN:-meet.localhost}
      - OVERWRITE_SETTING_Jitsi_URL_Room_Prefix=intellicare
      - OVERWRITE_SETTING_Jitsi_Open_New_Window=false
      - OVERWRITE_SETTING_Jitsi_Enable_Channels=true
      - OVERWRITE_SETTING_Jitsi_Chrome_Extension=
      
      # OAuth2/Keycloak (será configurado via UI)
      # - OVERWRITE_SETTING_Accounts_OAuth_Custom_Enable=true
      
    ports:
      - "3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - comunicacao-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/info"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ==========================================================================
  # JITSI MEET - Videoconferência
  # ==========================================================================
  
  # Jitsi Web (Frontend)
  jitsi-web:
    image: jitsi/web:stable
    container_name: comunicacao-jitsi-web
    restart: unless-stopped
    volumes:
      - jitsi_web_config:/config
      - jitsi_transcripts:/usr/share/jitsi-meet/transcripts
    environment:
      # Basic Configuration
      - ENABLE_AUTH=0
      - ENABLE_GUESTS=1
      - ENABLE_LETSENCRYPT=0
      - ENABLE_HTTP_REDIRECT=0
      - ENABLE_TRANSCRIPTIONS=0
      
      # Domain Configuration
      - PUBLIC_URL=${JITSI_PUBLIC_URL:-http://localhost:8443}
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_BOSH_URL_BASE=http://jitsi-prosody:5280
      - XMPP_MUC_DOMAIN=muc.meet.jitsi
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
      - XMPP_GUEST_DOMAIN=guest.meet.jitsi
      - XMPP_RECORDER_DOMAIN=recorder.meet.jitsi
      
      # JVB Configuration
      - JVB_TCP_HARVESTER_DISABLED=true
      
      # Timezone
      - TZ=America/Sao_Paulo
      
    ports:
      - "8443:80"
      - "8444:443"
    networks:
      - comunicacao-network

  # Jitsi Prosody (XMPP Server)
  jitsi-prosody:
    image: jitsi/prosody:stable
    container_name: comunicacao-jitsi-prosody
    restart: unless-stopped
    volumes:
      - jitsi_prosody_config:/config
      - jitsi_prosody_plugins:/prosody-plugins-custom
    environment:
      - ENABLE_AUTH=0
      - ENABLE_GUESTS=1
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_MUC_DOMAIN=muc.meet.jitsi
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
      - XMPP_GUEST_DOMAIN=guest.meet.jitsi
      - XMPP_RECORDER_DOMAIN=recorder.meet.jitsi
      - JICOFO_COMPONENT_SECRET=${JICOFO_COMPONENT_SECRET:-jicofo_secret}
      - JVB_AUTH_USER=jvb
      - JVB_AUTH_PASSWORD=${JVB_AUTH_PASSWORD:-jvb_password}
      - JIGASI_XMPP_USER=jigasi
      - JIGASI_XMPP_PASSWORD=${JIGASI_XMPP_PASSWORD:-jigasi_password}
      - JIBRI_XMPP_USER=jibri
      - JIBRI_XMPP_PASSWORD=${JIBRI_XMPP_PASSWORD:-jibri_password}
      - JIBRI_RECORDER_USER=recorder
      - JIBRI_RECORDER_PASSWORD=${JIBRI_RECORDER_PASSWORD:-recorder_password}
      - TZ=America/Sao_Paulo
    networks:
      - comunicacao-network

  # Jitsi Jicofo (Conference Focus)
  jitsi-jicofo:
    image: jitsi/jicofo:stable
    container_name: comunicacao-jitsi-jicofo
    restart: unless-stopped
    volumes:
      - jitsi_jicofo_config:/config
    environment:
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
      - XMPP_MUC_DOMAIN=muc.meet.jitsi
      - XMPP_SERVER=jitsi-prosody
      - JICOFO_COMPONENT_SECRET=${JICOFO_COMPONENT_SECRET:-jicofo_secret}
      - JICOFO_AUTH_USER=focus
      - JICOFO_AUTH_PASSWORD=${JICOFO_AUTH_PASSWORD:-focus_password}
      - TZ=America/Sao_Paulo
    depends_on:
      - jitsi-prosody
    networks:
      - comunicacao-network

  # Jitsi JVB (Video Bridge)
  jitsi-jvb:
    image: jitsi/jvb:stable
    container_name: comunicacao-jitsi-jvb
    restart: unless-stopped
    volumes:
      - jitsi_jvb_config:/config
    environment:
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
      - XMPP_SERVER=jitsi-prosody
      - JVB_AUTH_USER=jvb
      - JVB_AUTH_PASSWORD=${JVB_AUTH_PASSWORD:-jvb_password}
      - JVB_BREWERY_MUC=jvbbrewery
      - JVB_PORT=10000
      - JVB_TCP_HARVESTER_DISABLED=true
      - JVB_TCP_PORT=4443
      - JVB_STUN_SERVERS=stun.l.google.com:19302,stun1.l.google.com:19302,stun2.l.google.com:19302
      - TZ=America/Sao_Paulo
    ports:
      - "10000:10000/udp"
      - "4443:4443"
    depends_on:
      - jitsi-prosody
    networks:
      - comunicacao-network

# ============================================================================
# OBSERVAÇÕES
# ============================================================================
# 1. Flowise e Ollama serão adicionados na Semana 3-4
# 2. Kestra já existe no stack principal (será integrado depois)
# 3. PostgreSQL compartilhado do stack principal será usado
# 4. Para produção, configurar Traefik labels para SSL
