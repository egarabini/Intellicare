[tool.poetry]
name = "intellicare-pierre"
version = "1.0.0"
description = "MCP Server de inteligencia externa do IntelliCare — busca web, literatura medica, regulatorio, analise LLM"
authors = ["IntelliCare Team"]
readme = "README.md"
packages = [{include = "pierre"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
mcp = "^1.0.0"
tavily-python = "^0.3.0"
httpx = "^0.27.0"
pydantic = "^2.0.0"
sqlalchemy = "^2.0.0"
redis = "^5.0.0"
slowapi = "^0.1.9"
beautifulsoup4 = "^4.12.0"
lxml = "^5.0.0"
tenacity = "^8.2.0"
intellicare-core = {path = "../intellicare-core", develop = true}

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-mock = "^3.12.0"
pytest-cov = "^5.0.0"
ruff = "^0.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
