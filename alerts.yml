# Prometheus Alert Rules for IntelliCare Phase 1.4

groups:
  # =========================================================================
  # Database Alerts
  # =========================================================================
  - name: database_alerts
    interval: 30s
    rules:
      # PostgreSQL is down
      - alert: PostgresqlDown
        expr: up{job="postgresql"} == 0
        for: 1m
        labels:
          severity: critical
          service: postgresql
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL at {{ $labels.instance }} has been down for 1 minute"

      # High connection count
      - alert: PostgresqlHighConnections
        expr: pg_stat_activity_count > 150
        for: 2m
        labels:
          severity: warning
          service: postgresql
        annotations:
          summary: "PostgreSQL connection count high"
          description: "Current connections: {{ $value }}/200"

      # Slow query accumulation
      - alert: PostgresqlSlowQueries
        expr: increase(pg_stat_statements_mean_time[5m]) > 1000
        for: 2m
        labels:
          severity: warning
          service: postgresql
        annotations:
          summary: "PostgreSQL detecting slow queries (>1s avg)"
          description: "Average query time: {{ $value }}ms"

      # Disk space warning
      - alert: PostgresqlDiskSpace
        expr: node_filesystem_avail_bytes{mountpoint="/var/lib/postgresql/data"} / 
              node_filesystem_size_bytes{mountpoint="/var/lib/postgresql/data"} < 0.2
        for: 5m
        labels:
          severity: warning
          service: postgresql
        annotations:
          summary: "PostgreSQL disk space running low"
          description: "Remaining: {{ humanize $value }}% of disk"

      # Transaction ID wraparound warning
      - alert: PostgresqlTransactionIDWraparound
        expr: pg_datfrozenxid{datname="intellicare_db"} > 2147483647
        for: 1m
        labels:
          severity: critical
          service: postgresql
        annotations:
          summary: "PostgreSQL transaction ID wraparound imminent"
          description: "Database {{ $labels.datname }} needs VACUUM FREEZE"

  # =========================================================================
  # Redis Alerts
  # =========================================================================
  - name: redis_alerts
    interval: 30s
    rules:
      # Redis is down
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
          service: redis
        annotations:
          summary: "Redis is down"
          description: "Redis at {{ $labels.instance }} has been down for 1 minute"

      # High memory usage
      - alert: RedisHighMemory
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 2m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "Redis memory usage high"
          description: "Memory: {{ humanize $value }}% of max"

      # Consumer lag (if using Redis Streams)
      - alert: RedisStreamConsumerLag
        expr: redis_stream_consumer_pending_messages > 1000
        for: 5m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "Redis Stream consumer lag detected"
          description: "Pending messages: {{ $value }}"

      # Key eviction happening
      - alert: RedisKeyEviction
        expr: rate(redis_evicted_keys_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "Redis is evicting keys"
          description: "Eviction rate: {{ $value }} keys/sec. Need more memory."

  # =========================================================================
  # Application Alerts
  # =========================================================================
  - name: application_alerts
    interval: 30s
    rules:
      # Application is down
      - alert: ApplicationDown
        expr: up{job="intellicare-api"} == 0
        for: 1m
        labels:
          severity: critical
          service: intellicare-api
        annotations:
          summary: "IntelliCare API is down"
          description: "API at {{ $labels.instance }} has been down for 1 minute"

      # High error rate
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
          service: intellicare-api
        annotations:
          summary: "High error rate detected"
          description: "Error rate: {{ humanizePercentage $value }} of requests"

      # High latency
      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1.0
        for: 2m
        labels:
          severity: warning
          service: intellicare-api
        annotations:
          summary: "High API latency"
          description: "P95 latency: {{ humanizeDuration $value }}"

      # High memory usage
      - alert: ApplicationHighMemory
        expr: process_resident_memory_bytes{job="intellicare-api"} > 512000000  # 512MB
        for: 5m
        labels:
          severity: warning
          service: intellicare-api
        annotations:
          summary: "Application memory usage high"
          description: "Memory: {{ humanize $value }}B"

  # =========================================================================
  # Consolidation Service Alerts
  # =========================================================================
  - name: consolidation_alerts
    interval: 30s
    rules:
      # Consolidation lag high
      - alert: ConsolidationLagHigh
        expr: consolidation_lag_seconds > 300  # 5 minutes
        for: 2m
        labels:
          severity: warning
          service: consolidation
        annotations:
          summary: "Data consolidation lagging"
          description: "Lag: {{ humanizeDuration $value }}"

      # Events in DLQ (Dead Letter Queue)
      - alert: EventsInDLQ
        expr: consolidation_dlq_events_total > 10
        for: 5m
        labels:
          severity: warning
          service: consolidation
        annotations:
          summary: "Events being sent to DLQ"
          description: "DLQ events: {{ $value }}"

      # Consumer group lag
      - alert: ConsumerGroupLag
        expr: redis_stream_consumer_pending_messages > 500
        for: 5m
        labels:
          severity: warning
          service: consolidation
        annotations:
          summary: "Consolidation consumer lag high"
          description: "Pending: {{ $value }} messages"

  # =========================================================================
  # Integration Test Alerts
  # =========================================================================
  - name: integration_test_alerts
    interval: 1m
    rules:
      # Test suite failure
      - alert: IntegrationTestFailure
        expr: increase(test_failures_total[1m]) > 0
        for: 1m
        labels:
          severity: critical
          service: tests
        annotations:
          summary: "Integration tests failing"
          description: "Tests failed: {{ $value }}"

      # Performance test threshold exceeded
      - alert: PerformanceTestThreshold
        expr: performance_test_duration_seconds > 30
        for: 5m
        labels:
          severity: warning
          service: performance-tests
        annotations:
          summary: "Performance test exceeding target"
          description: "Duration: {{ humanizeDuration $value }}"

  # =========================================================================
  # Keycloak Alerts (T5.5)
  # =========================================================================
  - name: keycloak_alerts
    interval: 30s
    rules:
      # Keycloak is down
      - alert: KeycloakDown
        expr: up{job="keycloak"} == 0
        for: 1m
        labels:
          severity: critical
          service: keycloak
        annotations:
          summary: "Keycloak is down"
          description: "Keycloak at {{ $labels.instance }} has been down for 1 minute"

      # High login failure rate / possible brute force
      - alert: KeycloakHighLoginFailures
        expr: rate(keycloak_failed_login_attempts_total[5m]) > 5
        for: 2m
        labels:
          severity: warning
          service: keycloak
        annotations:
          summary: "High number of failed logins"
          description: "Keycloak is experiencing an unusual number of failed logins (>5/sec). Investigate for brute force."

# ============================================================================
# Alert Configuration Notes
# ============================================================================
# 1. Severities: critical, warning, info
# 2. All alerts firing to console by default (no integration configured)
# 3. To add integrations: update alertmanager config
# 4. Thresholds calibrated for development; adjust for production
# 5. for: duration = time alert must be firing before firing notification
# ============================================================================
