id: alerta-critico-notificacao
namespace: intellicare

description: |
  Workflow para processar alertas críticos de pacientes e enviar notificações.
  
  **Fluxo**:
  1. Recebe alerta crítico do Oswaldo
  2. Busca dados do paciente
  3. Identifica profissionais responsáveis
  4. Envia notificações (email, SMS, Rocket.Chat)
  5. Registra log de notificação

labels:
  module: nise
  priority: critical
  version: "1.0.0"

inputs:
  - id: paciente_id
    type: STRING
    required: true
    description: ID do paciente (ex: pac-123)
  
  - id: alerta_id
    type: STRING
    required: true
    description: ID do alerta crítico
  
  - id: tipo_alerta
    type: STRING
    required: true
    description: Tipo de alerta (critico, urgente)
    defaults: critico
  
  - id: mensagem
    type: STRING
    required: true
    description: Mensagem do alerta

tasks:
  # ── Buscar Dados do Paciente ──────────────────────────────────────────────
  
  - id: buscar_paciente
    type: io.kestra.plugin.core.http.Request
    uri: "http://nise:8000/api/v1/oswaldo/paciente/{{ inputs.paciente_id }}/resumo"
    method: GET
    headers:
      Content-Type: application/json
    description: Busca resumo completo do paciente no Oswaldo
  
  # ── Identificar Profissionais Responsáveis ─────────────────────────────────
  
  - id: identificar_responsaveis
    type: io.kestra.plugin.core.http.Request
    uri: "http://core:8000/api/v1/pacientes/{{ inputs.paciente_id }}/equipe"
    method: GET
    headers:
      Content-Type: application/json
    description: Busca equipe responsável pelo paciente
  
  # ── Enviar Notificação Email ───────────────────────────────────────────────
  
  - id: enviar_email
    type: io.kestra.plugin.notifications.mail.MailSend
    from: noreply@intellicare.com
    to: "{{ outputs.identificar_responsaveis.body.medico_email }}"
    subject: "🔴 ALERTA CRÍTICO - Paciente {{ inputs.paciente_id }}"
    htmlTextContent: |
      <h2>Alerta Crítico</h2>
      <p><strong>Paciente:</strong> {{ inputs.paciente_id }}</p>
      <p><strong>Tipo:</strong> {{ inputs.tipo_alerta }}</p>
      <p><strong>Mensagem:</strong> {{ inputs.mensagem }}</p>
      <p><strong>Data:</strong> {{ execution.startDate }}</p>
      
      <h3>Resumo do Paciente</h3>
      <pre>{{ outputs.buscar_paciente.body }}</pre>
      
      <p><a href="http://portal:3000/pacientes/{{ inputs.paciente_id }}">Ver Paciente</a></p>
    description: Envia email para médico responsável
  
  # ── Enviar Notificação Rocket.Chat ────────────────────────────────────────
  
  - id: enviar_rocketchat
    type: io.kestra.plugin.core.http.Request
    uri: "http://rocketchat:3000/api/v1/chat.postMessage"
    method: POST
    headers:
      Content-Type: application/json
      X-Auth-Token: "{{ secret('ROCKETCHAT_TOKEN') }}"
      X-User-Id: "{{ secret('ROCKETCHAT_USER_ID') }}"
    body: |
      {
        "channel": "#alertas-criticos",
        "text": "🔴 **ALERTA CRÍTICO**\n\n**Paciente:** {{ inputs.paciente_id }}\n**Tipo:** {{ inputs.tipo_alerta }}\n**Mensagem:** {{ inputs.mensagem }}\n\n[Ver Paciente](http://portal:3000/pacientes/{{ inputs.paciente_id }})"
      }
    description: Envia mensagem para canal Rocket.Chat
  
  # ── Registrar Log de Notificação ──────────────────────────────────────────
  
  - id: registrar_log
    type: io.kestra.plugin.core.http.Request
    uri: "http://nise:8000/api/v1/notificacoes/log"
    method: POST
    headers:
      Content-Type: application/json
    body: |
      {
        "paciente_id": "{{ inputs.paciente_id }}",
        "alerta_id": "{{ inputs.alerta_id }}",
        "tipo": "{{ inputs.tipo_alerta }}",
        "canais": ["email", "rocketchat"],
        "destinatarios": ["{{ outputs.identificar_responsaveis.body.medico_email }}"],
        "status": "enviado",
        "data_envio": "{{ execution.startDate }}"
      }
    description: Registra log de notificação no banco de dados

# ── Triggers ────────────────────────────────────────────────────────────────

triggers:
  # Trigger via webhook (chamado pelo Oswaldo quando alerta crítico é criado)
  - id: webhook_alerta_critico
    type: io.kestra.plugin.core.trigger.Webhook
    key: "{{ secret('WEBHOOK_KEY') }}"
    description: Recebe alertas críticos via webhook do Oswaldo
  
  # Trigger via polling (verifica alertas críticos a cada 5 minutos)
  - id: polling_alertas_criticos
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/5 * * * *"
    description: Verifica alertas críticos a cada 5 minutos
    inputs:
      paciente_id: "{{ trigger.paciente_id }}"
      alerta_id: "{{ trigger.alerta_id }}"
      tipo_alerta: "critico"
      mensagem: "{{ trigger.mensagem }}"

# ── Error Handling ──────────────────────────────────────────────────────────

errors:
  - id: notificar_erro
    type: io.kestra.plugin.notifications.mail.MailSend
    from: noreply@intellicare.com
    to: admin@intellicare.com
    subject: "❌ Erro no Workflow: Alerta Crítico"
    htmlTextContent: |
      <h2>Erro no Workflow</h2>
      <p><strong>Workflow:</strong> alerta-critico-notificacao</p>
      <p><strong>Execution ID:</strong> {{ execution.id }}</p>
      <p><strong>Erro:</strong> {{ task.error }}</p>
      <p><strong>Data:</strong> {{ execution.startDate }}</p>

