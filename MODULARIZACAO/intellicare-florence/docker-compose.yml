services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    ports:
      - "${FLORENCE_API_PORT:-8002}:8000"
    environment:
      - INTELLICARE_ENVIRONMENT=${INTELLICARE_ENVIRONMENT:-development}
      - INTELLICARE_LOG_LEVEL=${INTELLICARE_LOG_LEVEL:-INFO}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8000/api/v1/health'); assert r.status_code == 200"]
      interval: 30s
      timeout: 10s
      retries: 3
