# Prometheus Configuration for IntelliCare STEP 1.4
# Monitoring infrastructure for production readiness

global:
  scrape_interval: 15s      # How often to scrape targets
  evaluation_interval: 15s  # How often to evaluate rules
  external_labels:
    monitor: 'intellicare-phase-1.4'
    environment: 'development'

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Load rules once and periodically evaluate them
rule_files:
  - "alerts.yml"

# Scrape configurations
scrape_configs:
  # =========================================================================
  # Prometheus self-monitoring
  # =========================================================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # =========================================================================
  # PostgreSQL Exporter
  # Note: Run postgres_exporter container to enable this
  # docker run --net intellicare-network -p 9187:9187 \
  #   prometheuscommunity/postgres-exporter \
  #   --web.listen-address=:9187 \
  #   --collector.database_wraparound \
  #   DATA_SOURCE_NAME="postgresql://intellicare_admin:password@postgres:5432/intellicare_db"
  # =========================================================================
  - job_name: 'postgresql'
    static_configs:
      - targets: ['localhost:9187']
    scrape_interval: 30s
    scrape_timeout: 10s

  # =========================================================================
  # Redis Exporter
  # Note: Run redis_exporter container to enable this
  # docker run --net intellicare-network -p 9121:9121 \
  #   oliver006/redis_exporter \
  #   -redis.addr redis:6379
  # =========================================================================
  - job_name: 'redis'
    static_configs:
      - targets: ['localhost:9121']
    scrape_interval: 15s
    scrape_timeout: 5s

  # =========================================================================
  # Application Metrics (when running app)
  # The FastAPI application exposes metrics on /metrics
  # =========================================================================
  - job_name: 'intellicare-api'
    static_configs:
      - targets: ['localhost:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # =========================================================================
  # Node Exporter (System metrics - optional)
  # docker run --net intellicare-network -p 9100:9100 \
  #   prom/node-exporter
  # =========================================================================
  - job_name: 'system'
    static_configs:
      - targets: ['localhost:9100']

# ============================================================================
# Remote storage configuration (optional for production)
# ============================================================================
