# ============================================================================
# Documentation
# ============================================================================
# Access Prometheus dashboard:
#   http://localhost:9090
#
# Available metric endpoints:
#   - PostgreSQL: http://localhost:9187/metrics
#   - Redis: http://localhost:9121/metrics
#   - Application: http://localhost:8000/metrics
#   - System: http://localhost:9100/metrics
#
# Useful Prometheus queries:
#   - Uptime: up
#   - Rate: rate(metric_name[5m])
#   - Histogram: histogram_quantile(0.95, request_duration_seconds_bucket)
#   - Gauge: metric_name{job="job_name"}
#
# Graph exploration:
#   http://localhost:9090/graph
#
# Query examples:
#   - up{job="postgresql"}
#   - pg_stat_user_tables_seq_scan{datname="intellicare_db"}
#   - redis_memory_used_bytes
#   - process_resident_memory_bytes{job="intellicare-api"}
# ============================================================================
