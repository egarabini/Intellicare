[pytest]
# Pytest configuration for intellicare-comunicacao

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum Python version
minversion = 3.11

# Add options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=comunicacao
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=80
    -p no:warnings
    --ignore=tests/integration
    --ignore=tests/test_jitsi_client.py
    --ignore=tests/test_jitsi_dispatcher.py
    --ignore=tests/test_jitsi_room_service.py

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests
    api: API tests
    models: Model tests
    schemas: Schema tests
    dashboard: Dashboard tests

# Asyncio mode
asyncio_mode = auto

# Coverage configuration is in .coveragerc
