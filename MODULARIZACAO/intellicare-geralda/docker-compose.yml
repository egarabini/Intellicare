services:
  api:
    build:
      context: .
      target: api
    ports:
      - "${GERALDA_PORT:-8006}:8000"
    env_file:
      - .env
    environment:
      - INTELLICARE_MODULE_NAME=intellicare-geralda
      - INTELLICARE_MODULE_VERSION=1.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
