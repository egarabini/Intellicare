# IntelliCare V3 - Docker Compose (desenvolvimento local)
# Uso: docker compose --env-file infra/.env -f infra/docker-compose.yml up -d

name: intellicare

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: intellicare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - intellicare-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: intellicare-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - intellicare-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: intellicare-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: ${KC_DB}
      KC_DB_URL: ${KC_DB_URL}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_URL: ${KC_HOSTNAME_URL:-https://auth.intellicare.ia.br}
      KC_HOSTNAME_ADMIN_URL: ${KC_HOSTNAME_URL:-https://auth.intellicare.ia.br}
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8080:8080"
    networks:
      - intellicare-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080; echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\n\r\n' >&3; grep -q 'UP' <&3"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.intellicare-auth.rule=Host(`auth.intellicare.ia.br`)"
      - "traefik.http.routers.intellicare-auth.entrypoints=websecure"
      - "traefik.http.routers.intellicare-auth.tls.certresolver=letsencrypt"
      - "traefik.http.services.intellicare-auth.loadbalancer.server.port=8080"
      - "traefik.http.routers.intellicare-auth-http.rule=Host(`auth.intellicare.ia.br`)"
      - "traefik.http.routers.intellicare-auth-http.entrypoints=web"
      - "traefik.http.routers.intellicare-auth-http.middlewares=redirect-to-https"

  ollama:
    image: ollama/ollama:latest
    container_name: intellicare-ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST}
      OLLAMA_ORIGINS: ${OLLAMA_ORIGINS}
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - intellicare-net
    # Para GPU NVIDIA: descomentar as linhas abaixo
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  kestra:
    image: kestra/kestra:latest-full
    container_name: kestra
    restart: unless-stopped
    command: server standalone --worker-thread=128
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/kestra
            username: ${POSTGRES_USER}
            password: ${POSTGRES_PASSWORD}
        kestra:
          server:
            basic-auth:
              enabled: false
          repository:
            type: postgres
          storage:
            type: local
            local:
              base-path: /app/storage
          queue:
            type: postgres
          tasks:
            defaults: []
          url: http://kestra:8080
    volumes:
      - kestra_data:/app/storage
    networks:
      - intellicare-net
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kestra.rule=Host(`kestra.intellicare.ia.br`)"
      - "traefik.http.routers.kestra.entrypoints=websecure"
      - "traefik.http.routers.kestra.tls.certresolver=letsencrypt"
      - "traefik.http.services.kestra.loadbalancer.server.port=8080"

  mongo:
    image: mongo:6
    container_name: mongo
    restart: unless-stopped
    command: mongod --oplogSize 128 --replSet rs0
    volumes:
      - mongo_data:/data/db
    networks:
      - intellicare-net

  mongo-init-replica:
    image: mongo:6
    restart: on-failure
    command: >
      bash -c "sleep 5 && mongosh --host mongo --eval \"rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]})\""
    networks:
      - intellicare-net
    depends_on:
      - mongo

  rocketchat:
    image: rocket.chat:latest
    container_name: rocketchat
    restart: unless-stopped
    environment:
      MONGO_URL: "mongodb://mongo:27017/rocketchat?replicaSet=rs0"
      MONGO_OPLOG_URL: "mongodb://mongo:27017/local?replicaSet=rs0"
      ROOT_URL: "https://chat.intellicare.ia.br"
      PORT: "3001"
      DEPLOY_PLATFORM: docker
    volumes:
      - rocketchat_uploads:/app/uploads
    networks:
      - intellicare-net
    depends_on:
      - mongo
      - mongo-init-replica
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rocketchat.rule=Host(`chat.intellicare.ia.br`)"
      - "traefik.http.routers.rocketchat.entrypoints=websecure"
      - "traefik.http.routers.rocketchat.tls.certresolver=letsencrypt"
      - "traefik.http.services.rocketchat.loadbalancer.server.port=3001"

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: intellicare_evolution
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      SERVER_URL: http://evolution-api:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: "redis://:${REDIS_PASSWORD_URLENC}@redis:6379/6"
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: "postgresql://${POSTGRES_USER}:${EVOLUTION_DB_PASS}@postgres:5432/evolution"
      DATABASE_CONNECTION_CLIENT_NAME: evolution_client
      WEBHOOK_GLOBAL_URL: http://intellicare-service:8000/careplanner/webhook/whatsapp/${EVOLUTION_WEBHOOK_SECRET}
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "false"
      WEBHOOK_EVENTS_QRCODE_UPDATED: "false"
    depends_on:
      - postgres
      - redis
    networks:
      - intellicare-net

  marie-db:
    image: postgres:15-alpine
    container_name: marie-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dify
      POSTGRES_USER: dify
      POSTGRES_PASSWORD: ${MARIE_DB_PASSWORD}
    volumes:
      - marie_db_data:/var/lib/postgresql/data
    networks:
      - intellicare-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dify -d dify"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  marie-redis:
    image: redis:7-alpine
    container_name: marie-redis
    restart: unless-stopped
    command: redis-server --requirepass ${MARIE_REDIS_PASSWORD}
    networks:
      - intellicare-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${MARIE_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  marie-api:
    image: langgenius/dify-api:0.6.11
    container_name: marie-api
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      MODE: api
      MIGRATION_ENABLED: "true"
      DB_HOST: marie-db
      DB_PORT: 5432
      DB_USERNAME: dify
      DB_PASSWORD: ${MARIE_DB_PASSWORD}
      DB_DATABASE: dify
      REDIS_HOST: marie-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${MARIE_REDIS_PASSWORD}
      REDIS_DB: 0
      CELERY_BROKER_URL: redis://:${MARIE_REDIS_PASSWORD}@marie-redis:6379/1
      SECRET_KEY: ${MARIE_SECRET_KEY}
      SERVER_ENCRYPTION_KEY: ${SERVER_ENCRYPTION_KEY}
      STORAGE_TYPE: local
    depends_on:
      marie-db:
        condition: service_healthy
      marie-redis:
        condition: service_healthy
    networks:
      - intellicare-net

  marie-worker:
    image: langgenius/dify-api:0.6.11
    container_name: marie-worker
    restart: unless-stopped
    environment:
      MODE: worker
      DB_HOST: marie-db
      DB_PORT: 5432
      DB_USERNAME: dify
      DB_PASSWORD: ${MARIE_DB_PASSWORD}
      DB_DATABASE: dify
      REDIS_HOST: marie-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${MARIE_REDIS_PASSWORD}
      REDIS_DB: 0
      CELERY_BROKER_URL: redis://:${MARIE_REDIS_PASSWORD}@marie-redis:6379/1
      SECRET_KEY: ${MARIE_SECRET_KEY}
      SERVER_ENCRYPTION_KEY: ${SERVER_ENCRYPTION_KEY}
      STORAGE_TYPE: local
    depends_on:
      marie-db:
        condition: service_healthy
      marie-redis:
        condition: service_healthy
    networks:
      - intellicare-net

  marie-web:
    image: langgenius/dify-web:0.6.11
    container_name: marie-web
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      CONSOLE_API_URL: http://localhost:5001
      APP_API_URL: http://localhost:5001
    depends_on:
      - marie-api
    networks:
      - intellicare-net

  jitsi-web:
    image: jitsi/web:stable
    container_name: jitsi-web
    restart: unless-stopped
    environment:
      PUBLIC_URL: "https://meet.intellicare.ia.br"
      ENABLE_AUTH: 1
      AUTH_TYPE: jwt
      JWT_APP_ID: "${JITSI_APP_ID}"
      JWT_APP_SECRET: "${JITSI_APP_SECRET}"
      JWT_ACCEPTED_ISSUERS: "${JITSI_APP_ID}"
      JWT_ACCEPTED_AUDIENCES: "jitsi"
      XMPP_DOMAIN: "meet.jitsi"
      XMPP_AUTH_DOMAIN: "auth.meet.jitsi"
      XMPP_MUC_DOMAIN: "muc.meet.jitsi"
      XMPP_INTERNAL_MUC_DOMAIN: "internal-muc.meet.jitsi"
      JICOFO_AUTH_USER: focus
      TZ: America/Sao_Paulo
    volumes:
      - jitsi_web:/config
    networks:
      - intellicare-net
    depends_on:
      - jitsi-prosody
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jitsi.rule=Host(`meet.intellicare.ia.br`)"
      - "traefik.http.routers.jitsi.entrypoints=websecure"
      - "traefik.http.routers.jitsi.tls.certresolver=letsencrypt"
      - "traefik.http.services.jitsi.loadbalancer.server.port=80"

  jitsi-prosody:
    image: jitsi/prosody:stable
    container_name: jitsi-prosody
    restart: unless-stopped
    environment:
      XMPP_DOMAIN: "meet.jitsi"
      XMPP_AUTH_DOMAIN: "auth.meet.jitsi"
      XMPP_MUC_DOMAIN: "muc.meet.jitsi"
      XMPP_INTERNAL_MUC_DOMAIN: "internal-muc.meet.jitsi"
      JICOFO_AUTH_USER: focus
      JICOFO_AUTH_PASSWORD: "${JICOFO_AUTH_PASSWORD}"
      JVB_AUTH_USER: jvb
      JVB_AUTH_PASSWORD: "${JVB_AUTH_PASSWORD}"
      JWT_APP_ID: "${JITSI_APP_ID}"
      JWT_APP_SECRET: "${JITSI_APP_SECRET}"
      ENABLE_AUTH: 1
      AUTH_TYPE: jwt
      TZ: America/Sao_Paulo
    volumes:
      - jitsi_prosody:/config
    networks:
      - intellicare-net

  jitsi-jicofo:
    image: jitsi/jicofo:stable
    container_name: jitsi-jicofo
    restart: unless-stopped
    environment:
      XMPP_SERVER: jitsi-prosody
      XMPP_DOMAIN: "meet.jitsi"
      XMPP_AUTH_DOMAIN: "auth.meet.jitsi"
      XMPP_INTERNAL_MUC_DOMAIN: "internal-muc.meet.jitsi"
      JICOFO_AUTH_USER: focus
      JICOFO_AUTH_PASSWORD: "${JICOFO_AUTH_PASSWORD}"
      JVB_BREWERY_MUC: jvbbrewery
      TZ: America/Sao_Paulo
    volumes:
      - jitsi_jicofo:/config
    networks:
      - intellicare-net
    depends_on:
      - jitsi-prosody

  jitsi-jvb:
    image: jitsi/jvb:stable
    container_name: jitsi-jvb
    restart: unless-stopped
    environment:
      XMPP_SERVER: jitsi-prosody
      XMPP_DOMAIN: "meet.jitsi"
      XMPP_AUTH_DOMAIN: "auth.meet.jitsi"
      XMPP_INTERNAL_MUC_DOMAIN: "internal-muc.meet.jitsi"
      JVB_AUTH_USER: jvb
      JVB_AUTH_PASSWORD: "${JVB_AUTH_PASSWORD}"
      JVB_BREWERY_MUC: jvbbrewery
      JVB_PORT: 10000
      JVB_TCP_HARVESTER_DISABLED: "true"
      PUBLIC_URL: "https://meet.intellicare.ia.br"
      TZ: America/Sao_Paulo
    ports:
      - "10000:10000/udp"
    volumes:
      - jitsi_jvb:/config
    networks:
      - intellicare-net
    depends_on:
      - jitsi-prosody

  intellicare-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: intellicare-service
    restart: unless-stopped
    env_file:
      - ${INTELLICARE_ENV_FILE:-.env}
    environment:
      # Hosts Docker internos — sobrescrevem os defaults "localhost" do settings.py
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      OLLAMA_API_URL: http://ollama:11434
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      # Variáveis de app
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD_URLENC:-${REDIS_PASSWORD}}@redis:6379/0
      KEYCLOAK_URL: ${KEYCLOAK_INTERNAL_URL}
      KEYCLOAK_ISSUER_URL: ${KEYCLOAK_ISSUER_URL:-http://keycloak:8080/realms/intellicare}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      ENVIRONMENT: ${ENVIRONMENT}
      SECRET_KEY: ${SECRET_KEY}
      LOG_LEVEL: ${LOG_LEVEL}
      ENABLE_METRICS: ${ENABLE_METRICS:-true}
    ports:
      - "9000:8000"
    networks:
      - intellicare-net
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      ollama:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.intellicare.rule=Host(`localhost`)"
      - "traefik.http.routers.intellicare.service=intellicare"
      - "traefik.http.services.intellicare.loadbalancer.server.port=8000"
      # Portal (raiz)
      - "traefik.http.routers.intellicare-portal.rule=Host(`intellicare.ia.br`)"
      - "traefik.http.routers.intellicare-portal.entrypoints=websecure"
      - "traefik.http.routers.intellicare-portal.tls.certresolver=letsencrypt"
      - "traefik.http.routers.intellicare-portal.service=intellicare-portal"
      - "traefik.http.services.intellicare-portal.loadbalancer.server.port=8000"
      # API
      - "traefik.http.routers.intellicare-api.rule=Host(`api.intellicare.ia.br`)"
      - "traefik.http.routers.intellicare-api.entrypoints=websecure"
      - "traefik.http.routers.intellicare-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.intellicare-api.service=intellicare-api"
      - "traefik.http.services.intellicare-api.loadbalancer.server.port=8000"
      # Rota por subdomínio (produção) — redirect raiz para o path correto do frontend
      - "traefik.http.routers.intellicare-admin.rule=Host(`admin.intellicare.ia.br`)"
      - "traefik.http.routers.intellicare-admin.entrypoints=websecure"
      - "traefik.http.routers.intellicare-admin.tls.certresolver=letsencrypt"
      - "traefik.http.routers.intellicare-admin.service=intellicare-admin"
      - "traefik.http.routers.intellicare-admin.middlewares=admin-ui-redirect"
      - "traefik.http.services.intellicare-admin.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.admin-ui-redirect.redirectregex.regex=^(https://admin\\.intellicare\\.ia\\.br)/?$$"
      - "traefik.http.middlewares.admin-ui-redirect.redirectregex.replacement=$${1}/admin-ui/"
      - "traefik.http.middlewares.admin-ui-redirect.redirectregex.permanent=false"
      # Redirect HTTP → HTTPS
      - "traefik.http.routers.intellicare-admin-http.rule=Host(`admin.intellicare.ia.br`)"
      - "traefik.http.routers.intellicare-admin-http.entrypoints=web"
      - "traefik.http.routers.intellicare-admin-http.middlewares=redirect-to-https"
      - "traefik.http.routers.intellicare-admin-http.service=intellicare-admin"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.routers.intellicare-api-http.rule=Host(`api.intellicare.ia.br`)"
      - "traefik.http.routers.intellicare-api-http.entrypoints=web"
      - "traefik.http.routers.intellicare-api-http.middlewares=redirect-to-https"
      - "traefik.http.routers.intellicare-api-http.service=intellicare-api"
      - "traefik.http.routers.intellicare-portal-http.rule=Host(`intellicare.ia.br`)"
      - "traefik.http.routers.intellicare-portal-http.entrypoints=web"
      - "traefik.http.routers.intellicare-portal-http.service=intellicare-portal"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Observabilidade ──────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: intellicare-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - intellicare-net
    depends_on:
      - intellicare-service
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:10.4.0
    container_name: intellicare-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      # SMTP para alertas (DEM-028)
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: ${GRAFANA_SMTP_HOST:-smtp.gmail.com:587}
      GF_SMTP_USER: ${GRAFANA_SMTP_USER:-}
      GF_SMTP_PASSWORD: ${GRAFANA_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${GRAFANA_SMTP_USER:-alertas@intellicare.ia.br}
      GF_SMTP_FROM_NAME: "IntelliCare Alertas"
      GF_SMTP_STARTTLS_POLICY: "MandatoryStartTLS"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - intellicare-net
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: intellicare-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    networks:
      - intellicare-net
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.59.0
    container_name: intellicare-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - intellicare-net
    depends_on:
      - redis

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: intellicare-node-exporter
    restart: unless-stopped
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - intellicare-net

  # ── Reverse Proxy ─────────────────────────────────────────────

  traefik:
    image: traefik:v2.11.31
    container_name: intellicare-traefik
    restart: unless-stopped
    environment:
      DOCKER_API_VERSION: "1.44"
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=egarabini@gmail.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--log.level=INFO"
      - "--ping=true"
    ports:
      - "8081:80"
      - "8443:443"
      - "${TRAEFIK_DASHBOARD_PORT}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
    networks:
      - intellicare-net
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  jasmin:
    image: jookies/jasmin:0.10
    container_name: intellicare-jasmin
    restart: unless-stopped
    ports:
      - "1401:1401"
      - "8990:8990"
    environment:
      REDIS_CLIENT_HOST: redis
      REDIS_CLIENT_PORT: 6379
    depends_on:
      - redis
    volumes:
      - jasmin_data:/etc/jasmin
    networks:
      - intellicare-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: intellicare-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - intellicare-net
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pgadmin.rule=Host(`pgadmin.intellicare.ia.br`)"
      - "traefik.http.routers.pgadmin.entrypoints=websecure"
      - "traefik.http.routers.pgadmin.tls.certresolver=letsencrypt"
      - "traefik.http.services.pgadmin.loadbalancer.server.port=80"
      - "traefik.http.routers.pgadmin-http.rule=Host(`pgadmin.intellicare.ia.br`)"
      - "traefik.http.routers.pgadmin-http.entrypoints=web"
      - "traefik.http.routers.pgadmin-http.middlewares=redirect-to-https"
      - "traefik.http.routers.pgadmin-http.service=pgadmin"

  listmonk:
    image: listmonk/listmonk:v3.0.0
    container_name: intellicare-listmonk
    restart: unless-stopped
    ports:
      - "9001:9000"
    environment:
      LISTMONK_app__address: "0.0.0.0:9000"
      LISTMONK_db__host: postgres
      LISTMONK_db__port: 5432
      LISTMONK_db__user: ${POSTGRES_USER}
      LISTMONK_db__password: ${POSTGRES_PASSWORD}
      LISTMONK_db__database: listmonk
      LISTMONK_app__admin_username: ${LISTMONK_USERNAME}
      LISTMONK_app__admin_password: ${LISTMONK_PASSWORD}
    command: [ "sh", "-c", "yes | ./listmonk --install --idempotent && ./listmonk" ]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - intellicare-net

volumes:
  postgres_data:
  redis_data:
  keycloak_data:
  pgadmin_data:
  ollama_models:
  prometheus_data:
  grafana_data:
  kestra_data:
  mongo_data:
  marie_db_data:
  rocketchat_uploads:
  jitsi_web:
  jitsi_prosody:
  jitsi_jicofo:
  jitsi_jvb:
  jasmin_data:

networks:
  intellicare-net:
    driver: bridge
