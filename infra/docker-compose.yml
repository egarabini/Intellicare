# IntelliCare V3 - Docker Compose (desenvolvimento local)
# Uso: docker compose --env-file infra/.env -f infra/docker-compose.yml up -d

name: intellicare

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: intellicare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - intellicare-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: intellicare-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - intellicare-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: intellicare-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: ${KC_DB}
      KC_DB_URL: ${KC_DB_URL}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8080:8080"
    networks:
      - intellicare-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080; echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\n\r\n' >&3; grep -q 'UP' <&3"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.intellicare-auth.rule=Host(`auth.intellicare.ia.br`)"
      - "traefik.http.routers.intellicare-auth.entrypoints=websecure"
      - "traefik.http.routers.intellicare-auth.tls.certresolver=letsencrypt"
      - "traefik.http.services.intellicare-auth.loadbalancer.server.port=8080"
      - "traefik.http.routers.intellicare-auth-http.rule=Host(`auth.intellicare.ia.br`)"
      - "traefik.http.routers.intellicare-auth-http.entrypoints=web"
      - "traefik.http.routers.intellicare-auth-http.middlewares=redirect-to-https"

  ollama:
    image: ollama/ollama:latest
    container_name: intellicare-ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST}
      OLLAMA_ORIGINS: ${OLLAMA_ORIGINS}
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - intellicare-net
    # Para GPU NVIDIA: descomentar as linhas abaixo
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  intellicare-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: intellicare-service
    restart: unless-stopped
    env_file:
      - ${INTELLICARE_ENV_FILE:-.env}
    environment:
      # Hosts Docker internos — sobrescrevem os defaults "localhost" do settings.py
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      OLLAMA_API_URL: http://ollama:11434
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      # Variáveis de app
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      KEYCLOAK_URL: ${KEYCLOAK_INTERNAL_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      ENVIRONMENT: ${ENVIRONMENT}
      SECRET_KEY: ${SECRET_KEY}
      LOG_LEVEL: ${LOG_LEVEL}
      ENABLE_METRICS: ${ENABLE_METRICS:-true}
    ports:
      - "9000:8000"
    networks:
      - intellicare-net
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      ollama:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.intellicare.rule=Host(`localhost`)"
      - "traefik.http.services.intellicare.loadbalancer.server.port=8000"
      # Portal (raiz)
      - "traefik.http.routers.intellicare-portal.rule=Host(`intellicare.ia.br`)"
      - "traefik.http.routers.intellicare-portal.entrypoints=websecure"
      - "traefik.http.routers.intellicare-portal.tls.certresolver=letsencrypt"
      - "traefik.http.services.intellicare-portal.loadbalancer.server.port=8000"
      # API
      - "traefik.http.routers.intellicare-api.rule=Host(`api.intellicare.ia.br`)"
      - "traefik.http.routers.intellicare-api.entrypoints=websecure"
      - "traefik.http.routers.intellicare-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.intellicare-api.loadbalancer.server.port=8000"
      # Rota por subdomínio (produção)
      - "traefik.http.routers.intellicare-admin.rule=Host(`admin.intellicare.ia.br`)"
      - "traefik.http.routers.intellicare-admin.entrypoints=websecure"
      - "traefik.http.routers.intellicare-admin.tls.certresolver=letsencrypt"
      - "traefik.http.services.intellicare-admin.loadbalancer.server.port=8000"
      # Redirect HTTP → HTTPS
      - "traefik.http.routers.intellicare-admin-http.rule=Host(`admin.intellicare.ia.br`)"
      - "traefik.http.routers.intellicare-admin-http.entrypoints=web"
      - "traefik.http.routers.intellicare-admin-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.routers.intellicare-api-http.rule=Host(`api.intellicare.ia.br`)"
      - "traefik.http.routers.intellicare-api-http.entrypoints=web"
      - "traefik.http.routers.intellicare-api-http.middlewares=redirect-to-https"
      - "traefik.http.routers.intellicare-portal-http.rule=Host(`intellicare.ia.br`)"
      - "traefik.http.routers.intellicare-portal-http.entrypoints=web"
      - "traefik.http.routers.intellicare-portal-http.service=intellicare-portal"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Observabilidade ──────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: intellicare-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - intellicare-net
    depends_on:
      - intellicare-service
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:10.4.0
    container_name: intellicare-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - intellicare-net
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: intellicare-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    networks:
      - intellicare-net
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.59.0
    container_name: intellicare-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - intellicare-net
    depends_on:
      - redis

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: intellicare-node-exporter
    restart: unless-stopped
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - intellicare-net

  # ── Reverse Proxy ─────────────────────────────────────────────

  traefik:
    image: traefik:v3.2
    container_name: intellicare-traefik
    restart: unless-stopped
    environment:
      DOCKER_API_VERSION: "1.44"
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=egarabini@gmail.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--log.level=INFO"
      - "--ping=true"
    ports:
      - "80:80"
      - "443:443"
      - "${TRAEFIK_DASHBOARD_PORT}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
    networks:
      - intellicare-net
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  keycloak_data:
  ollama_models:
  prometheus_data:
  grafana_data:

networks:
  intellicare-net:
    driver: bridge
